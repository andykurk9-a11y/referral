# Render blueprint — https://render.com/docs/blueprint-spec
#
# Runs the tracker as an ordinary Node process against a local SQLite file.
# No separate database service is needed: unlike Netlify Functions, a Render
# web service has a writable filesystem, which is the whole reason the Netlify
# path needs Turso and this one does not.
#
# To use: Render dashboard → New → Blueprint → pick this repository.
# Render reads this file and creates the service; you set the password when
# prompted, and that is the entire setup.

services:
  - type: web
    name: referral-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    # Cheap public endpoint — keeps Render's health check off the database.
    healthCheckPath: /api/version
    autoDeploy: true
    envVars:
      # Prompted for on first deploy. Choose something strong; you can change it
      # again from Leadership → Settings once you are signed in.
      - key: REF_LEADERSHIP_PASSWORD
        sync: false

      # Signing key for session cookies. Generated by Render and never shown in
      # the repo. If it changes, everyone is simply signed out.
      - key: REF_SESSION_SECRET
        generateValue: true

      # THE FREE PLAN HAS NO PERSISTENT DISK — the database is wiped on every
      # restart and redeploy. This repopulates the demo data on boot, but only
      # when the orders table is completely empty, so it can never overwrite
      # real work. Set to false the moment this stops being a demo, and add a
      # persistent disk (see DEPLOY.md).
      - key: REF_AUTOSEED
        value: "true"

      - key: NODE_VERSION
        value: "20"

      # Email is optional. Add these in the Render dashboard when SMTP is ready;
      # without them the app still builds and previews digests, it just does not
      # send. Do not commit credentials here.
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   sync: false
      # - key: SMTP_SECURE
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false

# Keeping data across restarts needs a paid instance type and a disk. Move to
# Starter, then uncomment this under the service above and set
# REF_DATA_DIR=/var/data, and REF_AUTOSEED=false:
#
#    disk:
#      name: referral-data
#      mountPath: /var/data
#      sizeGB: 1
